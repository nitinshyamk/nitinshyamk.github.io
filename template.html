<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nitin Shyamkumar</title>
<meta name="description" content="Nitin Shyamkumar — applied mathematics, control, and software.">
<link rel="icon" href="/images/site-logo.png">
<link rel="canonical" href="https://nitinshyamk.github.io/">
<link rel="stylesheet" href="/style.css">
<script>
  /* Applied before first paint so a stored choice never flashes. The `js`
     class gates the folded abstracts: without scripting they stay open. */
  document.documentElement.className += " js";
  try {
    var t = localStorage.getItem("theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
</head>
<body>

<a class="skip" href="#future">Skip to content</a>

<button id="theme-toggle" class="theme-toggle" type="button" hidden>
  <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
    <circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <path d="M8 1.6a6.4 6.4 0 0 0 0 12.8z" fill="currentColor"/>
  </svg>
</button>

<header class="masthead">
  <img class="portrait" src="/images/mepic.jpg" alt="Nitin Shyamkumar" width="498" height="498">
  <div class="identity">
    <h1>Nitin Shyamkumar</h1>
    <nav class="links" aria-label="Elsewhere">
      {{links}}
    </nav>
  </div>
</header>

<main>

<section id="future">
  <h2>Future</h2>
  <div class="body">{{future}}</div>
</section>

<section id="current">
  <h2>Current</h2>
  <div class="body">{{current}}</div>
</section>

<section id="past">
  <h2>Past</h2>
  <div class="body">{{past}}</div>
</section>

<section id="publications">
  <h2>{{publications_heading}}</h2>
  <div class="body">{{publications}}</div>
</section>

</main>

<footer>
  <p>&copy; Nitin Shyamkumar</p>
</footer>

<script>
(function () {
  var root = document.documentElement;
  var btn = document.getElementById("theme-toggle");
  function current() {
    return root.getAttribute("data-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  function describe() {
    var next = current() === "dark" ? "light" : "dark";
    btn.setAttribute("aria-label", "Switch to " + next + " theme");
    btn.title = "Switch to " + next + " theme";
  }
  btn.hidden = false;
  describe();
  btn.addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    describe();
  });
})();

/* Publications: the summary line and the full abstract trade places. */
(function () {
  var bodies = document.querySelectorAll(".pub-body");
  Array.prototype.forEach.call(bodies, function (body) {
    var summary = body.querySelector(".pub-summary");
    function set(open) {
      body.setAttribute("data-open", open ? "true" : "false");
      summary.setAttribute("aria-expanded", open ? "true" : "false");
    }
    set(false);
    Array.prototype.forEach.call(body.querySelectorAll("[data-toggle]"), function (el) {
      el.addEventListener("click", function () {
        set(body.getAttribute("data-open") !== "true");
      });
    });
  });
})();
</script>

</body>
</html>
